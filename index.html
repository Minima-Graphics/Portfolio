<!DOCTYPE html>
<html>
<head>
    <title>Minima Graphics</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: "Avenir", "Avenir Next", sans-serif; font-weight;
        }

        img {
            display: block;
            width: 100vu;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <h1>Minima Graphics</h1>
    <p>Minimal graphic design.</p>

    <img src="AstriaTN_g191.png" alt="My design">
    <img src="AstriaTN_g190.png" alt="My design 2">

    <script>
      function displayWidth() {
        let width = window.innerWidth;
      }

      // Run the function once when the page loads
      displayWidth();

      // Run the function every time the window is resized
      window.addEventListener('resize', displayWidth);
    </script>

</body>
</html>
